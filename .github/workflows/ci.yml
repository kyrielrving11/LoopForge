name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: loopforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: loopforge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify generated artifacts
        run: git diff --exit-code -- dist ../loopforge-protocol.json
      - run: npm pack --dry-run --json
